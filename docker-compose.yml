name: rsshub

services:
  rsshub:
    image: rsshub
    build:
      context: .
      args:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
    restart: always
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: "redis://rss-redis:6379/"
    networks:
      - ai-service
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:1200/healthz']
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis

  redis:
    container_name: rss-redis
    image: redis:alpine
    restart: always
    volumes:
      - ./redis_data:/data
    networks:
      - ai-service
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s

networks:
  ai-service:
    external: true
